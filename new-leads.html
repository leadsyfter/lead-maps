<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>New Leads Map Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
  <style>
    html, body { margin:0; padding:0; height:100%; }
    #map { position:absolute; inset:0; }
    .mapboxgl-popup { max-width: 460px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .mapboxgl-popup-content { padding: 0; border-radius: 10px; overflow: hidden; }
    .popup-header { padding: 14px 16px 6px 16px; }
    .eyebrow { font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 6px 0; }
    .title { margin: 0; font-size: 18px; line-height: 1.25; }
    .photo-wrap { width: 100%; aspect-ratio: 16 / 9; background:#f2f2f2; overflow:hidden; }
    .photo-wrap a, .photo-wrap img { display:block; width:100%; height:100%; object-fit:cover; }
    .meta { padding: 10px 16px 2px 16px; color:#333; font-size:13px; display:grid; grid-template-columns: 1fr 1fr; gap:6px 14px; }
    .meta div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { padding: 4px 16px 12px 16px; font-size:13px; color:#333; }
    .btnbar { display:flex; }
    .btn { flex:1; text-align:center; padding:12px 10px; text-decoration:none; font-weight:600; border-top:1px solid #e6e6e6; }
    .btn:first-child { border-right:1px solid #e6e6e6; }
    .btn-primary { background:#003d60; color:#fff; }
    .btn-light { background:#fafafa; color:#003d60; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-weight:700; font-size:11px; line-height:18px; }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  // 1) Set your token
  mapboxgl.accessToken = 'YOUR_MAPBOX_ACCESS_TOKEN';

  // 2) Helper: read ?src=
  const params = new URLSearchParams(location.search);
  const src = params.get('src');

  if (!src) {
    document.body.innerHTML = '<p style="padding:16px;font-family:sans-serif;">Add a <code>?src=</code> URL to a JSON feed.</p>';
  } else {
    fetch(src).then(r => r.json()).then(raw => init(normalize(raw))).catch(err => {
      console.error(err);
      alert('Failed to load data. Check the ?src URL and JSON format.');
    });
  }

  // 3) Normalize your screenshot’s structure into an array of items
  function normalize(raw) {
    // Cases supported:
    //  A) raw is already an array of lead objects
    //  B) raw is a single object with fields and a `leadName` array (your screenshot)
    //  C) raw is a single object representing one item
    const asArray = Array.isArray(raw) ? raw : (Array.isArray(raw.leadName) ? raw.leadName : [raw]);

    // Carry top-level coordinates if children don’t have them
    const topLat  = raw.latitude  ?? raw.navLat  ?? null;
    const topLon  = raw.longitude ?? raw.navLon  ?? null;

    return asArray.map(item => {
      const lat = item.latitude  ?? topLat;
      const lon = item.longitude ?? topLon;
      return {
        latitude:        num(lat),
        longitude:       num(lon),
        navLat:          num(item.navLat ?? raw.navLat),
        navLon:          num(item.navLon ?? raw.navLon),
        heading:         num(item.heading ?? raw.heading),
        photoUrl:        item.photoUrl ?? raw.photoUrl ?? null,
        addressUrl:      item.addressUrl ?? raw.addressUrl ?? null,
        assetType:       item.assetType ?? raw.assetType ?? null,
        assetCategory:   item.assetCategory ?? raw.assetCategory ?? null,
        propertyName:    item.propertyName ?? raw.propertyName ?? null,
        propertyAddress: item.propertyAddress ?? raw.propertyAddress ?? null,
        sqft:            item.sqft ?? raw.sqft ?? null,
        year:            item.year ?? raw.year ?? null,
        units:           item.units ?? raw.units ?? null,
        buildings:       item.buildings ?? raw.buildings ?? null,
        leadUrl:         item.leadUrl ?? raw.leadUrl ?? null
      };
    }).filter(p => isFinite(p.latitude) && isFinite(p.longitude));
  }

  function num(v){ const n = Number(v); return isFinite(n) ? n : undefined; }

  // 4) Color for the eyebrow by assetType
  function assetTypeColor(type){
    if(!type) return '#6b7280';
    const t = String(type).toLowerCase();
    if (t.includes('lead'))         return '#2563eb'; // blue
    if (t.includes('condo'))        return '#a21caf'; // purple
    if (t.includes('building'))     return '#16a34a'; // green
    if (t.includes('random'))       return '#f59e0b'; // amber
    return '#6b7280';
  }

  // 5) Marker color (keep simple, one style for all “lead” pins)
  function markerColor(){ return '#003d60'; }

  // 6) Build the map & features
  function init(items){
    // Center: first item or its nav coords
    const first = items[0];
    const center = [
      (isFinite(first.navLon) ? first.navLon : first.longitude),
      (isFinite(first.navLat) ? first.navLat : first.latitude)
    ];

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center,
      zoom: 12
    });

    map.on('load', () => {
      // Add a simple circle layer for markers
      const fc = {
        type: 'FeatureCollection',
        features: items.map((p, i) => ({
          type: 'Feature',
          properties: {
            idx: i,
            color: markerColor()
          },
          geometry: {
            type: 'Point',
            coordinates: [p.longitude, p.latitude]
          }
        }))
      };

      map.addSource('leads', { type: 'geojson', data: fc });
      map.addLayer({
        id: 'leads-circles',
        type: 'circle',
        source: 'leads',
        paint: {
          'circle-radius': 7,
          'circle-color': ['get', 'color'],
          'circle-stroke-color': '#ffffff',
          'circle-stroke-width': 1.5
        }
      });

      // Popups
      map.on('click', 'leads-circles', (e) => {
        const feature = e.features[0];
        const idx = feature.properties.idx;
        const p = items[idx];

        const eyebrowColor = assetTypeColor(p.assetType);

        const title = [
          p.propertyAddress || '',
          p.propertyName && p.propertyAddress ? ` — ${p.propertyName}` : (p.propertyName || '')
        ].join('');

        const photo = p.photoUrl
          ? `<div class="photo-wrap"><a href="${safe(p.addressUrl) || '#'}" target="_blank" rel="noopener"><img src="${safe(p.photoUrl)}" alt="Street view"/></a></div>`
          : '';

        const meta = `
          <div class="meta">
            ${val('Category', p.assetCategory)}
            ${val('Type', p.assetType)}
            ${val('Sq Ft', p.sqft)}
            ${val('Units', p.units)}
            ${val('Buildings', p.buildings)}
            ${val('Year', p.year)}
          </div>`;

        const links = `
          <div class="btnbar">
            <a class="btn btn-light" href="${safe(p.leadUrl) || '#'}" target="_blank" rel="noopener">Open Lead</a>
            <a class="btn btn-primary" href="${safe(p.addressUrl) || '#'}" target="_blank" rel="noopener">Open in Google Maps</a>
          </div>`;

        const html = `
          <div class="popup-header">
            <div class="eyebrow" style="color:${eyebrowColor}">${safe(p.assetType || 'Lead')}</div>
            <h3 class="title">${safe(title || 'Property')}</h3>
          </div>
          ${photo}
          ${meta}
          ${p.propertyAddress ? `<div class="row">${safe(p.propertyAddress)}</div>` : ''}
          ${links}
        `;

        new mapboxgl.Popup({ offset: 12, closeOnClick: true })
          .setLngLat(feature.geometry.coordinates)
          .setHTML(html)
          .addTo(map);
      });

      map.on('mouseenter', 'leads-circles', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', 'leads-circles', () => map.getCanvas().style.cursor = '');
    });
  }

  // small helpers
  function safe(s){ return (s ?? '').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  function val(label, v){
    if (v === null || v === undefined || v === '') return '<div></div>';
    return `<div><strong>${label}:</strong> ${safe(v)}</div>`;
  }
</script>
</body>
</html>
