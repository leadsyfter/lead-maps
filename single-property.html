<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Single Property Map Viewer</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
  <style>
    :root { --primary:#003d60; --primary-contrast:#fff; --panel-bg:#fff; --shadow:rgba(0,0,0,.12); }
    html,body{height:100%} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    #map{position:absolute;inset:0}
    .control-panel{position:absolute;top:10px;right:10px;z-index:2;background:var(--panel-bg);border-radius:10px;box-shadow:0 6px 20px var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:center}
    .control-panel select{border:1px solid #d0d7de;border-radius:8px;padding:6px 8px;font-size:14px}
    #loading{position:absolute;inset:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;text-align:center;gap:10px}
    #loading h2{margin:0;font-weight:600;color:#1a1a1a}
    #error{color:#c62828;max-width:720px;padding:0 16px;white-space:pre-wrap}
    .mapboxgl-popup{max-width:420px}.mapboxgl-popup-content{padding:14px;border-radius:12px;box-shadow:0 8px 24px var(--shadow)}
    .property-popup h3{margin:0 0 8px;font-size:18px;line-height:1.25;color:#111}
    .property-popup .meta{margin:8px 0 10px;color:#333;font-size:14px}.property-popup .meta p{margin:4px 0}
    .property-popup .image{margin:10px 0 12px;border-radius:10px;overflow:hidden;max-height:220px}
    .property-popup .image img{display:block;width:100%;height:220px;object-fit:cover}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{display:inline-block;text-decoration:none;font-weight:600;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid #cdd9e5;transition:transform .06s ease,background .2s ease}
    .btn:active{transform:translateY(1px)} .btn.primary{background:var(--primary);color:var(--primary-contrast);border-color:var(--primary)} .btn.ghost{background:#fff;color:#0f172a}
    @media (max-width:480px){.mapboxgl-popup{width:calc(100vw - 32px)} .property-popup .image img{height:180px}}
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="control-panel">
    <label for="map-style" style="font-size:12px;color:#475569">Style</label>
    <select id="map-style" aria-label="Map style">
      <option value="mapbox://styles/mapbox/streets-v12">Streets</option>
      <option value="mapbox://styles/mapbox/light-v11">Light</option>
      <option value="mapbox://styles/mapbox/dark-v11">Dark</option>
      <option value="mapbox://styles/mapbox/outdoors-v12">Outdoors</option>
      <option value="mapbox://styles/mapbox/satellite-v9">Satellite</option>
      <option value="mapbox://styles/mapbox/satellite-streets-v12">Sat + Streets</option>
      <option value="3d-terrain">3D Satellite</option>
    </select>
  </div>

  <div id="loading">
    <h2>Loading property…</h2>
    <div id="error"></div>
  </div>

  <script>
    // ---- Config ----
    mapboxgl.accessToken = 'pk.eyJ1IjoibGVhZHN5ZnRlciIsImEiOiJjbTd2Z2k3MjYwYjFvMnFvZHd0NmE4M3pvIn0.xHYtpfn9dQa7CZOoY29-cA';

    // ---- Helpers ----
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const toNumber = v => { if (v === undefined || v === null || v === '') return undefined; const n = typeof v === 'number' ? v : parseFloat(String(v).trim()); return Number.isFinite(n) ? n : undefined; };
    const fmtInt = v => { const n = toNumber(v); return Number.isFinite(n) ? new Intl.NumberFormat().format(Math.round(n)) : ''; };
    const buildNav = ({lng,lat,name}) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving&destination_place_name=${encodeURIComponent(name||'Property')}`;
    const buildSV  = ({pano_latitude,pano_longitude,heading}) => { const lat=toNumber(pano_latitude), lng=toNumber(pano_longitude), head=toNumber(heading)??0; if(!Number.isFinite(lat)||!Number.isFinite(lng)) return null; return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}&heading=${head}&pitch=0&fov=80`; };

    function normalizeFromObject(obj){
      if(!obj) return null;
      const pickNum=(...keys)=>{ for(const k of keys){ if(Object.prototype.hasOwnProperty.call(obj,k) && obj[k]!=null && obj[k]!=='') return toNumber(obj[k]); } };
      const pickStr=(...keys)=>{ for(const k of keys){ if(Object.prototype.hasOwnProperty.call(obj,k) && obj[k]!=null && String(obj[k]).trim()!=='') return String(obj[k]); } return ''; };

      if(obj.type==='Feature' && obj.geometry && obj.properties){
        const {geometry, properties:props}=obj; const coords=geometry.coordinates||[];
        const pNum=v=>toNumber(v), pStr=v=>v==null?'':String(v);
        return {
          name:pStr(props.project_name??props.name??props.Name??''),
          project:pStr(props.project??props.Project??''),
          address:pStr(props.project_address??props.address??props.Address??''),
          longitude:toNumber(coords[0]),
          latitude:toNumber(coords[1]),
          photo_url:pStr(props.photo_url??props.photo??props.Photo??''),
          pano_latitude:pNum(props.pano_latitude??props.pano_lat??props.NavLat??props.navLat),
          pano_longitude:pNum(props.pano_longitude??props.pano_lng??props.NavLon??props.navLon),
          heading:pNum(props.heading??props.Heading),
          asset_class:pStr(props.asset_class??props.asset??props.Type??''),
          sq_ft:pNum(props.sq_ft??props.sqft??props['Sq Ft']),
          units:pNum(props.units??props.Units)
        };
      }
      return {
        name:pickStr('project_name','name','Name'),
        project:pickStr('project','Project'),
        address:pickStr('project_address','address','Address'),
        longitude:pickNum('longitude','lng','Longitude','Lon'),
        latitude:pickNum('latitude','lat','Latitude','Lat'),
        photo_url:pickStr('photo_url','photo','Photo'),
        pano_latitude:pickNum('pano_latitude','pano_lat','NavLat','navLat'),
        pano_longitude:pickNum('pano_longitude','pano_lng','NavLon','navLon'),
        heading:pickNum('heading','Heading'),
        asset_class:pickStr('asset_class','asset','Type'),
        sq_ft:pickNum('sq_ft','sqft','Sq Ft'),
        units:pickNum('units','Units')
      };
    }

    function fromQueryParams(){
      const qp=Object.fromEntries(params.entries());
      return normalizeFromObject({
        name:qp.name, project:qp.project, address:qp.address,
        lat:qp.lat, lng:qp.lng, photo:qp.photo,
        pano_lat:qp.pano_lat, pano_lng:qp.pano_lng, heading:qp.heading,
        asset:qp.asset, sqft:qp.sqft, units:qp.units
      });
    }

    async function loadProperty(){
      // supports ?src=, legacy ?t=, and optional ?i=
      let src=params.get('src');
      const t=params.get('t');
      const i=toNumber(params.get('i')); const index=Number.isFinite(i)?Math.max(0,Math.floor(i)):0;
      if(!src && t){ src=`https://raw.githubusercontent.com/leadsyfter/images/main/data/projects_${t}.json`; }

      if(src){
        const res=await fetch(src);
        if(!res.ok) throw new Error(`Failed to fetch src: ${res.status} ${res.statusText}`);
        let obj=await res.json();

        // tolerate double-encoded or wrapped JSON
        if(typeof obj==='string'){ try{ obj=JSON.parse(obj);}catch{} }
        if(obj && typeof obj==='object' && typeof obj.json==='string'){ try{ obj=JSON.parse(obj.json);}catch{} }

        if(Array.isArray(obj) && obj.length>0){ return normalizeFromObject(obj[Math.min(index,obj.length-1)]); }
        if(obj && Array.isArray(obj.features) && obj.features.length>0){ return normalizeFromObject(obj[Math.min(index,obj.features.length-1)]); }
        return normalizeFromObject(obj);
      }
      return fromQueryParams();
    }

    function validateProperty(p){
      if(!p) return 'No property data found. Provide ?src=<url>, ?t=<timestamp>, or pass lat/lng in the query string.';
      if(!Number.isFinite(p.latitude) || !Number.isFinite(p.longitude)) return 'Missing or invalid lat/lng.';
      return null;
    }

    function popupHTML(p){
      const name=p.name||'Unnamed Property';
      const address=p.address||'';
      const projectLine=p.project?`<p><strong>Project:</strong> ${p.project}</p>`:'';
      const asset=p.asset_class?`<p><strong>Asset:</strong> ${p.asset_class}</p>`:'';
      const sqft=Number.isFinite(p.sq_ft)?`<p><strong>Sq Ft:</strong> ${fmtInt(p.sq_ft)}</p>`:'';
      const units=Number.isFinite(p.units)?`<p><strong>Units:</strong> ${fmtInt(p.units)}</p>`:'';
      const sv=buildSV(p);
      const nav=buildNav({lng:p.longitude,lat:p.latitude,name});
      const img=p.photo_url?`<div class="image">${sv?`<a href="${sv}" target="_blank" rel="noopener">`:''}<img src="${p.photo_url}" alt="Photo of ${name}" loading="lazy" />${sv?'</a>':''}</div>`:'';
      return `<div class="property-popup"><h3>${name}</h3>${img}<div class="meta">${projectLine}${address?`<p><strong>Address:</strong> ${address}</p>`:''}${asset}${sqft}${units}</div><div class="actions">${sv?`<a class="btn ghost" href="${sv}" target="_blank" rel="noopener">Street View</a>`:''}<a class="btn primary" href="${nav}" target="_blank" rel="noopener">Navigate in Google Maps</a></div></div>`;
    }

    function enableStyleSelector(map){
      const sel=$('map-style');
      sel.addEventListener('change',()=>{
        const val=sel.value;
        if(val==='3d-terrain'){
          map.setStyle('mapbox://styles/mapbox/satellite-streets-v12');
          map.once('styledata',()=>{
            map.setPitch(60); map.setBearing(-17.6);
            if(!map.getSource('mapbox-dem')){
              map.addSource('mapbox-dem',{type:'raster-dem',url:'mapbox://mapbox.terrain-rgb',tileSize:512,maxzoom:14});
              map.setTerrain({source:'mapbox-dem',exaggeration:1.5});
            }
            if(!map.getLayer('sky')){
              map.addLayer({id:'sky',type:'sky',paint:{'sky-type':'atmosphere','sky-atmosphere-sun':[0,0],'sky-atmosphere-sun-intensity':15}});
            }
          });
        }else{
          map.setTerrain(null);
          if(map.getLayer('sky')) map.removeLayer('sky');
          if(map.getSource('mapbox-dem')) map.removeSource('mapbox-dem');
          map.setStyle(val);
        }
      });
    }

    // surface JS errors on the page so you can see them
    window.addEventListener('error', e => { $('error').textContent = 'Script error: ' + e.message; });
    window.addEventListener('unhandledrejection', e => { $('error').textContent = 'Promise error: ' + (e.reason && e.reason.message || e.reason); });

    (async function init(){
      try{
        const prop = await loadProperty();
        const err = validateProperty(prop);
        if(err) throw new Error(err);

        const map = new mapboxgl.Map({
          container:'map', style:'mapbox://styles/mapbox/streets-v12',
          center:[prop.longitude, prop.latitude], zoom: toNumber(params.get('z')) ?? 16
        });
        map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}));
        map.addControl(new mapboxgl.FullscreenControl());

        const popup = new mapboxgl.Popup({offset:18}).setHTML(popupHTML(prop));
        new mapboxgl.Marker({color:'#3887be'}).setLngLat([prop.longitude,prop.latitude]).setPopup(popup).addTo(map);
        map.once('load',()=>popup.addTo(map));

        enableStyleSelector(map);
        $('loading').style.display='none';
      }catch(e){
        $('error').textContent = (e && e.message) ? e.message : String(e);
        $('loading').style.display='flex';
      }
    })();
  </script>
</body>
</html>
