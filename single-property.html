<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Property / Comps Map</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { position: absolute; inset: 0; }

    /* Popup layout */
    .mapboxgl-popup { max-width: 420px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .mapboxgl-popup-content { display: flex; flex-direction: column; border-radius: 16px; }
    .property-popup h3 { margin: 6px 0 8px; line-height: 1.2; }
    .eyebrow {
      display: inline-block;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
      letter-spacing: .2px;
    }
    /* Eyebrow color mapping (by assetType) */
    .eyebrow--building { background:#E9F3FF; color:#155FA0; }   /* Building Comp. */
    .eyebrow--condo    { background:#FDEEEE; color:#B42318; }   /* Condo Comp. */
    .eyebrow--lead     { background:#EBF8F1; color:#166A46; }   /* Lead / Deal */
    .eyebrow--random   { background:#F7F5FF; color:#4B2BBF; }   /* Random Loc. */

    /* Wide Street View image block (~browser aspect) */
    .property-photo { width: 100%; aspect-ratio: 2 / 1; overflow: hidden; border-radius: 12px; background: #eee; margin: 8px 0 12px; }
    .property-photo img { width: 100%; height: 100%; display: block; object-fit: cover; }

    .property-link { display:inline-block; margin-bottom:10px; text-decoration:none; color:#1a73e8; }
    .property-link:hover { text-decoration:underline; }

    .kv { margin: 6px 0; }
    .kv b { font-weight: 700; }

    /* Full-width CTA button affixed to bottom of content */
    .popup-cta { margin-top: auto; }
    .popup-cta .btn {
      display: block; width: 100%;
      padding: 12px 16px; border: 0; border-radius: 12px;
      font-weight: 700; text-align: center; color: #fff;
      background: #2b6cb0; cursor: pointer; text-decoration: none;
    }
    .popup-cta .btn:hover { opacity: 0.92; }

    /* Marker dots (if using HTML markers) */
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // ======= CONFIG =======
    mapboxgl.accessToken = "YOUR_MAPBOX_TOKEN";

    // Status-based colors for COMPS (independent from eyebrow colors)
    const statusColors = {
      "Active": "#1f9d55",   // green
      "Escrow": "#f59e0b",   // orange
      "Sold":   "#dc2626",   // red
      // fallback
      "Default": "#3b82f6"
    };

    // Eyebrow class by assetType (new field)
    function eyebrowClass(assetType) {
      const t = (assetType || "").toLowerCase();
      if (t.includes("building comp")) return "eyebrow--building";
      if (t.includes("condo comp"))    return "eyebrow--condo";
      if (t.includes("lead") || t.includes("deal")) return "eyebrow--lead";
      if (t.includes("random"))        return "eyebrow--random";
      return "eyebrow--lead"; // default styling
    }

    // Build a Google Maps link; add &layer=c to hint Street View layer
    function buildGmapsUrl(addr) {
      const q = encodeURIComponent(addr || "");
      return `https://www.google.com/maps?q=${q}`;
    }
    function buildStreetViewUrl(addr) {
      const q = encodeURIComponent(addr || "");
      return `https://www.google.com/maps?q=${q}&layer=c`;
    }

    // Load GeoJSON from ?src= URL param (expects FeatureCollection/Feature(s))
    async function loadData() {
      const params = new URLSearchParams(location.search);
      const src = params.get("src");
      if (!src) throw new Error("Missing ?src= URL to GeoJSON");
      const res = await fetch(src, { cache: "no-cache" });
      if (!res.ok) throw new Error(`Failed to load data: ${res.status}`);
      return await res.json();
    }

    function toFeatureCollection(data) {
      if (!data) return { type: "FeatureCollection", features: [] };
      if (data.type === "FeatureCollection") return data;
      if (data.type === "Feature") return { type: "FeatureCollection", features: [data] };
      if (Array.isArray(data)) return { type: "FeatureCollection", features: data };
      throw new Error("Unsupported data format");
    }

    function markerColorFor(feature) {
      const p = feature.properties || {};
      const status = (p.saleStatus || p.status || "").trim();
      return statusColors[status] || statusColors.Default;
    }

    function popupHtml(p) {
      // Required fields (by your latest spec):
      // p.assetCategory (replaces old assetType)
      // p.assetType (NEW: "Building Comp.", "Condo Comp.", "Lead / Deal", "Random Loc.")
      // Optional: p.title / p.projectName, p.address, p.photoUrl, p.streetViewUrl, p.propertyDataUrl, p.sqft, p.units, p.saleStatus
      const title = p.title || p.projectName || p.address || "Property";
      const eyebrow = p.assetType || ""; // new classification
      const eyebrowCls = eyebrowClass(eyebrow);

      const addr = p.address || "";
      const mapLink = p.mapUrl || buildGmapsUrl(addr);
      const svUrl = p.streetViewUrl || buildStreetViewUrl(addr);

      const photoUrl = p.photoUrl || p.imageUrl || ""; // image displayed & clickable to Street View
      const propertyDataUrl = p.propertyDataUrl || p.dataUrl || mapLink;

      const rows = [
        p.assetCategory ? `<p class="kv"><b>Asset:</b> ${escapeHtml(p.assetCategory)}</p>` : "",
        p.sqft ? `<p class="kv"><b>Sq Ft:</b> ${numberFmt(p.sqft)}</p>` : "",
        p.units ? `<p class="kv"><b>Units:</b> ${numberFmt(p.units)}</p>` : "",
        p.saleStatus ? `<p class="kv"><b>Status:</b> ${escapeHtml(p.saleStatus)}</p>` : ""
      ].join("");

      return `
        <div class="property-popup">
          ${eyebrow ? `<div class="eyebrow ${eyebrowCls}">${escapeHtml(eyebrow)}</div>` : ""}
          <h3>${escapeHtml(title)}</h3>

          ${photoUrl ? `
            <a class="property-photo" href="${svUrl}" target="_blank" rel="noopener">
              <img src="${photoUrl}" alt="Street View" />
            </a>` : ""}

          ${addr ? `<a class="property-link" href="${mapLink}" target="_blank" rel="noopener">${escapeHtml(addr)}</a>` : ""}

          ${rows}

          <div class="popup-cta">
            <a class="btn" href="${propertyDataUrl}" target="_blank" rel="noopener">Property Data</a>
          </div>
        </div>
      `;
    }

    // Simple HTML escaper
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }
    function numberFmt(n) {
      const x = typeof n === "number" ? n : parseFloat(String(n).replace(/[, ]/g, ""));
      if (isNaN(x)) return escapeHtml(n);
      return x.toLocaleString();
    }

    // Create a small HTML marker dot
    function makeDot(color) {
      const el = document.createElement("div");
      el.className = "dot";
      el.style.background = color;
      return el;
    }

    // ======= BOOT =======
    (async function init() {
      const data = await loadData();
      const fc = toFeatureCollection(data);

      // If no bbox, auto fit to features
      const bbox = turf.bbox(fc);

      const map = new mapboxgl.Map({
        container: "map",
        style: "mapbox://styles/mapbox/streets-v12",
        center: [(bbox[0]+bbox[2])/2, (bbox[1]+bbox[3])/2],
        zoom: 10
      });

      map.addControl(new mapboxgl.NavigationControl(), "top-right");

      map.on("load", () => {
        // Fit bounds with padding if multiple features
        if (fc.features.length) {
          map.fitBounds(bbox, { padding: 60, duration: 0, maxZoom: 16 });
        }

        // Add markers + popups
        fc.features.forEach(f => {
          const p = f.properties || {};
          const color = markerColorFor(f);
          const marker = new mapboxgl.Marker({ element: makeDot(color), anchor: "center" })
            .setLngLat(f.geometry.coordinates)
            .setPopup(new mapboxgl.Popup({ offset: 16 }).setHTML(popupHtml(p)))
            .addTo(map);
        });
      });
    })().catch(err => {
      console.error(err);
      alert(err.message || err);
    });
  </script>
</body>
</html>
