<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Projects & Comps Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
<style>
  html, body { height:100%; margin:0; }
  #map { position:absolute; top:0; bottom:0; width:100%; }
  .controls {
    position:absolute; z-index:2; top:10px; left:10px;
    background:#fff; padding:10px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.15);
    font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size:13px;
    max-width:280px;
  }
  .controls h3 { margin:0 0 6px; font-size:14px; }
  .legend { display:grid; grid-template-columns:18px 1fr; gap:6px 8px; align-items:center; margin-top:6px; }
  .swatch { width:18px; height:18px; border:1px solid #00000022; border-radius:3px; }
  .popup { max-width:320px; }
  .popup img { width:100%; height:auto; display:block; border-radius:4px; margin-bottom:8px; }
  .popup .title { font-weight:600; margin-bottom:4px; }
  .popup .meta { color:#444; margin-bottom:6px; }
  .popup .btns a {
    display:inline-block; margin-right:8px; margin-top:6px; padding:6px 10px; border-radius:4px;
    border:1px solid #00000022; text-decoration:none; font-weight:600;
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="controls">
  <h3>Map Options</h3>
  <label>Style:
    <select id="styleSelect">
      <option value="mapbox://styles/mapbox/streets-v12">Streets</option>
      <option value="mapbox://styles/mapbox/outdoors-v12">Outdoors</option>
      <option value="mapbox://styles/mapbox/light-v11">Light</option>
      <option value="mapbox://styles/mapbox/dark-v11">Dark (Night)</option>
      <option value="mapbox://styles/mapbox/satellite-streets-v12">Satellite</option>
      <option value="mapbox://styles/mapbox/navigation-day-v1">Navigation Day</option>
      <option value="mapbox://styles/mapbox/navigation-night-v1">Navigation Night</option>
    </select>
  </label>
  <div>
    <label><input type="checkbox" id="terrainToggle"> Terrain</label>
    <label style="margin-left:10px;"><input type="checkbox" id="bldg3dToggle"> 3D Buildings</label>
  </div>

  <hr>

  <h3>Layers</h3>
  <div>
    <label><input type="checkbox" class="groupToggle" data-group="projects" checked> Projects</label><br/>
    <label><input type="checkbox" class="sublayerToggle" data-layer="projects-Leads" checked> Leads</label><br/>
    <label><input type="checkbox" class="sublayerToggle" data-layer="projects-Deals" checked> Deals</label><br/>
    <label><input type="checkbox" class="sublayerToggle" data-layer="projects-Closed" checked> Closed</label><br/>
    <label><input type="checkbox" class="sublayerToggle" data-layer="projects-Archive" checked> Archive</label>
  </div>
  <div style="margin-top:6px;">
    <label><input type="checkbox" class="groupToggle" data-group="comps" checked> Comps</label><br/>
    <label><input type="checkbox" class="sublayerToggle" data-layer="comps-Active" checked> Active</label><br/>
    <label><input type="checkbox" class="sublayerToggle" data-layer="comps-Escrow" checked> Escrow</label><br/>
    <label><input type="checkbox" class="sublayerToggle" data-layer="comps-Sold" checked> Sold</label><br/>
    <label><input type="checkbox" class="sublayerToggle" data-layer="comps-Withdrawn" checked> Withdrawn</label>
  </div>

  <hr>

  <h3>Rings (on selected)</h3>
  <label><input type="checkbox" class="ringToggle" data-miles="1"> 1 mile</label>
  <label style="margin-left:8px;"><input type="checkbox" class="ringToggle" data-miles="5"> 5 miles</label>
  <label style="margin-left:8px;"><input type="checkbox" class="ringToggle" data-miles="10"> 10 miles</label>

  <div class="legend" style="margin-top:10px;">
    <div class="swatch" style="background:#1E90FF"></div><div>Projects: Leads</div>
    <div class="swatch" style="background:#FFA500"></div><div>Projects: Deals</div>
    <div class="swatch" style="background:#2ECC71"></div><div>Projects: Closed</div>
    <div class="swatch" style="background:#95A5A6"></div><div>Projects: Archive</div>
    <div class="swatch" style="background:#16A085"></div><div>Comps: Active</div>
    <div class="swatch" style="background:#F39C12"></div><div>Comps: Escrow</div>
    <div class="swatch" style="background:#C0392B"></div><div>Comps: Sold</div>
    <div class="swatch" style="background:#7F8C8D"></div><div>Comps: Withdrawn</div>
  </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script>
  // ====== CONFIG ======
  mapboxgl.accessToken = 'YOUR_MAPBOX_ACCESS_TOKEN';
  const PROJECT_STATUS = ['Leads','Deals','Closed','Archive'];
  const COMP_STATUS = ['Active','Escrow','Sold','Withdrawn'];

  const PROJECT_COLORS = {
    'Leads':'#1E90FF',
    'Deals':'#FFA500',
    'Closed':'#2ECC71',
    'Archive':'#95A5A6'
  };
  const COMP_COLORS = {
    'Active':'#16A085',
    'Escrow':'#F39C12',
    'Sold':'#C0392B',
    'Withdrawn':'#7F8C8D'
  };

  // Different marker "style":
  // - Projects: solid circles
  // - Comps: hollow circles (thick outline)
  const PROJECT_PAINT = (status)=>({
    'circle-radius': 7,
    'circle-color': PROJECT_COLORS[status],
    'circle-stroke-color': '#00000066',
    'circle-stroke-width': 1.25
  });
  const COMP_PAINT = (status)=>({
    'circle-radius': 7,
    'circle-color': '#00000000',
    'circle-stroke-color': COMP_COLORS[status],
    'circle-stroke-width': 2.25
  });

  // ====== MAP INIT ======
  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v12',
    center: [-117.15, 32.78],
    zoom: 10
  });

  map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}), 'bottom-right');
  map.addControl(new mapboxgl.FullscreenControl(), 'bottom-right');
  map.addControl(new mapboxgl.ScaleControl({maxWidth:100, unit:'imperial'}));

  // ====== SOURCES ======
  async function ensureSources() {
    if (!map.getSource('projects')) {
      map.addSource('projects', {type:'geojson', data:'projects.geojson'});
    }
    if (!map.getSource('comps')) {
      map.addSource('comps', {type:'geojson', data:'comps.geojson'});
    }
    if (!map.getSource('rings')) {
      map.addSource('rings', {type:'geojson', data: {"type":"FeatureCollection","features":[]}});
    }
  }

  // ====== LAYERS (with status sublayers) ======
  function addProjectLayers() {
    PROJECT_STATUS.forEach((s, idx) => {
      const id = `projects-${s}`;
      if (map.getLayer(id)) return;
      map.addLayer({
        id,
        type: 'circle',
        source: 'projects',
        filter: ['all', ['==', ['get','status'], s], ['==', ['get','type'], 'Project']],
        paint: PROJECT_PAINT(s)
      }, firstSymbolId()); // insert before first symbol layer for clarity
      map.on('click', id, e => onFeatureClick(e));
      map.on('mouseenter', id, ()=> map.getCanvas().style.cursor='pointer');
      map.on('mouseleave', id, ()=> map.getCanvas().style.cursor='');
    });
  }

  function addCompLayers() {
    COMP_STATUS.forEach((s, idx) => {
      const id = `comps-${s}`;
      if (map.getLayer(id)) return;
      map.addLayer({
        id,
        type: 'circle',
        source: 'comps',
        filter: ['all', ['==', ['get','status'], s], ['==', ['get','type'], 'Comp']],
        paint: COMP_PAINT(s)
      }, firstSymbolId());
      map.on('click', id, e => onFeatureClick(e));
      map.on('mouseenter', id, ()=> map.getCanvas().style.cursor='pointer');
      map.on('mouseleave', id, ()=> map.getCanvas().style.cursor='');
    });
  }

  function firstSymbolId() {
    const layers = map.getStyle().layers;
    for (const l of layers) {
      if (l.type === 'symbol') return l.id;
    }
    return undefined;
  }

  // ====== POPUP & RINGS ======
  let popup;
  let selectedLngLat = null;

  function onFeatureClick(e) {
    const f = e.features[0];
    const p = f.properties;
    const coord = f.geometry.type === 'Point'
      ? f.geometry.coordinates.slice()
      : e.lngLat.toArray();

    selectedLngLat = coord;

    const fmt = (v)=> (v===null||typeof v==="undefined"||v==="") ? "—" : v;
    const img = p.streetViewImgUrl ? `<img src="${fmt(p.streetViewImgUrl)}" alt="Street View">` : "";
    const title = `${fmt(p.name)} (${fmt(p.type)} — ${fmt(p.status)})`;
    const meta = `${fmt(p.address)}<br>${Number(p.sqft||0).toLocaleString()} sf · $${Number(p.price||0).toLocaleString()} · $${Number(p.ppsf||0).toFixed(2)}/sf`;

    const btns = `
      <div class="btns">
        <a href="${fmt(p.navUrl)}" target="_blank" rel="noopener">Navigate</a>
        <a href="${fmt(p.recordUrl)}" target="_blank" rel="noopener">View Info</a>
      </div>`;

    const viewStreet = p.streetViewUrl ? `<div><a href="${fmt(p.streetViewUrl)}" target="_blank" rel="noopener">Open Street View</a></div>` : "";

    const html = `
      <div class="popup">
        ${img}
        <div class="title">${title}</div>
        <div class="meta">${meta}</div>
        ${btns}
        ${viewStreet}
      </div>`;

    if (popup) popup.remove();
    popup = new mapboxgl.Popup({offset:15, maxWidth:"360px"})
      .setLngLat(coord)
      .setHTML(html)
      .addTo(map);

    updateRings(); // refresh rings in case toggles are on
  }

  function updateRings() {
    if (!selectedLngLat) return;
    const milesOn = Array.from(document.querySelectorAll('.ringToggle'))
      .filter(cb => cb.checked)
      .map(cb => Number(cb.dataset.miles));

    const features = milesOn.map(m => {
      const poly = turf.circle([selectedLngLat[0], selectedLngLat[1]], m, {steps: 128, units:'miles'});
      poly.properties = { miles: m };
      return poly;
    });

    const fc = { type:'FeatureCollection', features };
    map.getSource('rings').setData(fc);

    // Add/ensure ring layers (fill + outline)
    if (!map.getLayer('rings-fill')) {
      map.addLayer({
        id:'rings-fill', type:'fill', source:'rings',
        paint:{ 'fill-color':'#4a90e2', 'fill-opacity':0.08 }
      }, firstSymbolId());
    }
    if (!map.getLayer('rings-line')) {
      map.addLayer({
        id:'rings-line', type:'line', source:'rings',
        paint:{ 'line-color':'#4a90e2', 'line-width':2, 'line-dasharray':[2,2] }
      }, firstSymbolId());
    }
  }

  // ====== STYLE / TERRAIN / 3D ======
  function addTerrainAndSky() {
    if (!map.getSource('mapbox-dem')) {
      map.addSource('mapbox-dem', {
        type: 'raster-dem',
        url: 'mapbox://mapbox.terrain-rgb',
        tileSize: 512
      });
    }
    map.setTerrain({ source: 'mapbox-dem', exaggeration: 1.2 });
    if (!map.getLayer('sky')) {
      map.addLayer({
        id: 'sky',
        type: 'sky',
        paint: {
          'sky-type': 'atmosphere',
          'sky-atmosphere-sun-intensity': 15
        }
      });
    }
  }

  function removeTerrainAndSky() {
    map.setTerrain(null);
    if (map.getLayer('sky')) map.removeLayer('sky');
    if (map.getSource('mapbox-dem')) map.removeSource('mapbox-dem');
  }

  function add3DBuildings() {
    // insert 3D buildings just above labels
    const labelLayerId = firstSymbolId();
    if (map.getLayer('3d-buildings')) return;
    map.addLayer({
      'id': '3d-buildings',
      'source': 'composite',
      'source-layer': 'building',
      'filter': ['==', ['get', 'extrude'], 'true'],
      'type': 'fill-extrusion',
      'minzoom': 15,
      'paint': {
        'fill-extrusion-color': '#aaa',
        'fill-extrusion-height': ['get', 'height'],
        'fill-extrusion-base': ['get', 'min_height'],
        'fill-extrusion-opacity': 0.6
      }
    }, labelLayerId);
  }

  function remove3DBuildings() {
    if (map.getLayer('3d-buildings')) map.removeLayer('3d-buildings');
  }

  // Handle style switching: re-add sources/layers after each style load
  async function rebuildAfterStyleLoad() {
    await ensureSources();
    addProjectLayers();
    addCompLayers();

    // Rebuild rings source/layers (if any toggles are checked)
    if (!map.getSource('rings')) {
      map.addSource('rings', {type:'geojson', data: {"type":"FeatureCollection","features":[]}});
    }
    if (selectedLngLat) updateRings();

    // Respect toggles
    document.querySelectorAll('.sublayerToggle').forEach(cb=>{
      const id = cb.dataset.layer;
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', cb.checked?'visible':'none');
    });
    document.querySelectorAll('.groupToggle').forEach(cb=>{
      const grp = cb.dataset.group;
      const ids = (grp === 'projects') ? PROJECT_STATUS.map(s=>`projects-${s}`) : COMP_STATUS.map(s=>`comps-${s}`);
      ids.forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id,'visibility',cb.checked?'visible':'none'); });
    });

    // Terrain / 3D checkboxes
    if (document.getElementById('terrainToggle').checked) addTerrainAndSky();
    if (document.getElementById('bldg3dToggle').checked) add3DBuildings();
  }

  map.on('load', rebuildAfterStyleLoad);

  // ====== UI EVENTS ======
  document.getElementById('styleSelect').addEventListener('change', (e)=>{
    map.setStyle(e.target.value);
    map.once('styledata', rebuildAfterStyleLoad);
  });

  document.getElementById('terrainToggle').addEventListener('change', (e)=>{
    if (e.target.checked) addTerrainAndSky(); else removeTerrainAndSky();
  });

  document.getElementById('bldg3dToggle').addEventListener('change', (e)=>{
    if (e.target.checked) add3DBuildings(); else remove3DBuildings();
  });

  document.querySelectorAll('.sublayerToggle').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const id = cb.dataset.layer;
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', cb.checked?'visible':'none');
    });
  });

  document.querySelectorAll('.groupToggle').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const grp = cb.dataset.group;
      const ids = (grp === 'projects') ? PROJECT_STATUS.map(s=>`projects-${s}`) : COMP_STATUS.map(s=>`comps-${s}`);
      ids.forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id,'visibility', cb.checked?'visible':'none'); });
    });
  });

  document.querySelectorAll('.ringToggle').forEach(cb=>{
    cb.addEventListener('change', ()=> updateRings());
  });

</script>
</body>
</html>
