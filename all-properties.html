<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Leads + Comps Map (focusable)</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet"/>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
  <style>
    html, body { height:100%; margin:0; }
    #map { position:absolute; inset:0; }
    .controls {
      position:absolute; top:10px; right:10px; z-index:2;
      background:#fff; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.15);
      padding:10px 12px; font:14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .controls label { display:flex; align-items:center; gap:6px; margin-bottom:6px; cursor:pointer; }
    .legend { margin-top:6px; border-top:1px solid #eee; padding-top:8px; }
    .key { display:flex; align-items:center; gap:8px; margin:4px 0; }
    .swatch { width:12px; height:12px; border-radius:50%; border:1px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.15) inset; }
    .popup { max-width:360px; }
    .popup h3 { margin:0 0 6px; font-size:16px; }
    .popup img { width:100%; height:auto; border-radius:4px; display:block; margin:6px 0 8px; }
    .row { display:flex; justify-content:space-between; gap:8px; }
    .row div { flex:1; }
    .muted { color:#666; font-size:12px; }
    .error {
      position:absolute; left:10px; bottom:10px; z-index:2; background:#ffecec; color:#900;
      border:1px solid #f5a9a9; padding:8px 10px; border-radius:6px; max-width:60ch; font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
  </style>
</head>
<body>
<div id="map"></div>

<div class="controls">
  <label><input type="checkbox" id="toggle-leads" checked> Show Leads</label>
  <label><input type="checkbox" id="toggle-comps" checked> Show Comps</label>
  <div class="legend">
    <div class="key"><span class="swatch" style="background:#003D60"></span> Leads</div>
    <div class="key"><span class="swatch" style="background:#2ECC71"></span> Comps — Active</div>
    <div class="key"><span class="swatch" style="background:#F39C12"></span> Comps — Escrow</div>
    <div class="key"><span class="swatch" style="background:#E74C3C"></span> Comps — Sold</div>
  </div>
</div>

<script>
  // ---------------- CONFIG ----------------
  const MAPBOX_TOKEN = 'pk.eyJ1IjoibGVhZHN5ZnRlciIsImEiOiJjbTd2Z2k3MjYwYjFvMnFvZHd0NmE4M3pvIn0.xHYtpfn9dQa7CZOoY29-cA'; // <- replace
  const MAP_STYLE = 'mapbox://styles/mapbox/streets-v12';

  // Optional defaults if URL params are omitted
  const DEFAULT_LEADS_URL = ''; // e.g. 'https://raw.githubusercontent.com/.../leads.geojson'
  const DEFAULT_COMPS_URL = ''; // e.g. 'https://raw.githubusercontent.com/.../comps.geojson'

  // Status → color mapping for COMPS layer
  const COMPS_STATUS_COLORS = {
    active: '#2ECC71',
    escrow: '#F39C12',
    pending: '#F39C12',
    sold:   '#E74C3C'
  };
  const LEADS_COLOR = '#003D60';

  // ---------------- HELPERS ----------------
  const qs = new URLSearchParams(location.search);
  const param = (k, d=null) => qs.get(k) ?? d;
  const boolParam = (k, d=true) => {
    const v = qs.get(k);
    if (v === null) return d;
    return ['1','true','yes','on'].includes(v.toLowerCase());
  };

  function ciProp(props, keys) {
    // case-insensitive getter for the first matching key
    const map = {};
    for (const k in props) map[k.toLowerCase()] = props[k];
    for (const k of keys) {
      const v = map[String(k).toLowerCase()];
      if (v !== undefined && v !== null && v !== '') return v;
    }
    return undefined;
  }

  function fmtNum(x) {
    const n = Number(x);
    if (!isFinite(n)) return '';
    return n.toLocaleString();
  }
  function fmtMoney(x) {
    const n = Number(x);
    if (!isFinite(n)) return '';
    return n.toLocaleString(undefined,{style:'currency',currency:'USD',maximumFractionDigits:0});
  }
  function escapeHTML(str) {
    return String(str ?? '').replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }
  function buildStreetViewURL(lngLat) {
    if (!lngLat) return null;
    const [lng, lat] = lngLat;
    return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`;
  }

  // Try to construct a useful popup from heterogeneous props
  function buildPopupHTML(feature, type) {
    const p = feature.properties || {};
    const lngLat = feature.geometry?.type === 'Point' ? feature.geometry.coordinates : null;

    // Common fields (case-insensitive) with fallbacks
    const addr = ciProp(p, ['Address','Property_Address','Street','Location','FullAddress','Property']);
    const name = ciProp(p, ['Name','Title','Property_Name','Project','Building','Lead_Name']);
    const photo = ciProp(p, ['Photo','Image','Image_URL','ImageUrl','PhotoURL','photo_url']);
    const svUrl = ciProp(p, ['StreetViewURL','Street_View_URL','StreetView','Street_View','street_view_url']) || buildStreetViewURL(lngLat);
    const assetType = ciProp(p, ['Asset_Type','AssetType','Type','Use']);
    const sqft = ciProp(p, ['Sq_Ft','Square_Feet','SF','Size','Area']);
    const status = ciProp(p, ['Sale_Status','Status','SaleStatus']);
    const price = ciProp(p, ['Sale_Price','Price','Price_Total','Closed_Price']);
    const ppsf  = ciProp(p, ['Price_per_SF','PPSF','PricePerSF']);
    const date  = ciProp(p, ['Sale_Date','Close_Date','Date']);
    const dom   = ciProp(p, ['DOM','Days_on_Market','DaysOnMarket']);
    const id    = ciProp(p, ['id','lead_id','property_id','uuid','UID','Identifier']);

    const title = escapeHTML(addr || name || id || `${type === 'comps' ? 'Comp' : 'Lead'}`);
    let html = `<div class="popup">`;
    html += `<h3>${title}</h3>`;

    if (photo) {
      const photoUrl = escapeHTML(photo);
      const link = svUrl ? svUrl : photoUrl;
      html += `<a href="${escapeHTML(link)}" target="_blank" rel="noopener"><img src="${photoUrl}" alt="Photo"/></a>`;
    }

    // Two-column rows where useful
    const lines = [];
    if (assetType) lines.push(`<div><strong>Type</strong><br>${escapeHTML(assetType)}</div>`);
    if (sqft)      lines.push(`<div><strong>Sq Ft</strong><br>${fmtNum(sqft)}</div>`);
    if (type === 'comps') {
      if (status) lines.push(`<div><strong>Status</strong><br>${escapeHTML(status)}</div>`);
      if (price)  lines.push(`<div><strong>Price</strong><br>${fmtMoney(price)}</div>`);
      if (ppsf)   lines.push(`<div><strong>PPSF</strong><br>$${fmtNum(ppsf)}</div>`);
      if (date)   lines.push(`<div><strong>Date</strong><br>${escapeHTML(date)}</div>`);
      if (dom)    lines.push(`<div><strong>DOM</strong><br>${escapeHTML(dom)}</div>`);
    } else {
      if (status) lines.push(`<div><strong>Status</strong><br>${escapeHTML(status)}</div>`);
      if (id)     lines.push(`<div><strong>ID</strong><br>${escapeHTML(id)}</div>`);
    }

    for (let i = 0; i < lines.length; i += 2) {
      html += `<div class="row">${lines[i] || ''}${lines[i+1] || ''}</div>`;
    }

    if (svUrl) {
      html += `<div class="muted"><a href="${escapeHTML(svUrl)}" target="_blank" rel="noopener">Open Street View</a></div>`;
    }
    html += `</div>`;
    return html;
  }

  function compsColorExpression() {
    // Map multiple status strings to color; default gray
    return [
      'match',
      ['downcase', ['coalesce',
        ['get','Sale_Status'], ['get','status'], ['get','SaleStatus'], ''
      ]],
      'active', COMPS_STATUS_COLORS.active,
      'escrow', COMPS_STATUS_COLORS.escrow,
      'pending', COMPS_STATUS_COLORS.pending,
      'sold', COMPS_STATUS_COLORS.sold,
      '#999999'
    ];
  }

  function sizeByZoom() {
    // Smooth radius scaling by zoom
    return [
      'interpolate', ['linear'], ['zoom'],
      8, 4,
      12, 7,
      16, 10
    ];
  }

  async function fetchJSON(url) {
    if (!url) return null;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Fetch failed ${res.status} for ${url}`);
    return await res.json();
  }

  function findFeatureById(geojson, field, value) {
    if (!geojson || !Array.isArray(geojson.features)) return null;
    const keysToTry = field ? [field] : ['id','lead_id','property_id','uuid','UID','Identifier','Name','Property'];
    const vLower = String(value).toLowerCase();
    for (const f of geojson.features) {
      const props = f.properties || {};
      for (const k of keysToTry) {
        const got = ciProp(props, [k]);
        if (got !== undefined && String(got).toLowerCase() === vLower) return f;
      }
    }
    return null;
  }

  function featureCenter(f) {
    if (!f || !f.geometry) return null;
    if (f.geometry.type === 'Point') return f.geometry.coordinates;
    // Rough center for non-points
    try {
      // minimal bbox center
      const coords = JSON.stringify(f.geometry);
      const gj = JSON.parse(`{"type":"FeatureCollection","features":[${JSON.stringify(f)}]}`);
      let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
      const walker = (g) => {
        if (g.type === 'Point') {
          const [x,y] = g.coordinates; minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y);
        } else {
          const arrs = (g.coordinates || []);
          (function dive(a){
            if (typeof a[0] === 'number') {
              const [x,y] = a; minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y);
            } else {
              for (const sub of a) dive(sub);
            }
          })(arrs);
        }
      };
      walker(f.geometry);
      if (isFinite(minX)) return [ (minX+maxX)/2, (minY+maxY)/2 ];
    } catch(e) {}
    return null;
  }

  // ---------------- MAP ----------------
  mapboxgl.accessToken = MAPBOX_TOKEN;
  const map = new mapboxgl.Map({
    container: 'map',
    style: MAP_STYLE,
    center: [ -118.2437, 34.0522 ], // LA default
    zoom: 9
  });
  map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');

  const leadsURL = param('leads', DEFAULT_LEADS_URL);
  const compsURL = param('comps', DEFAULT_COMPS_URL);
  const showLeadsInitial = boolParam('showLeads', true);
  const showCompsInitial = boolParam('showComps', true);

  const errors = [];
  let leadsData = null, compsData = null;

  (async () => {
    try { leadsData = await fetchJSON(leadsURL); } catch(e){ if (leadsURL) errors.push(e.message); }
    try { compsData = await fetchJSON(compsURL); } catch(e){ if (compsURL) errors.push(e.message); }

    map.on('load', () => {
      // Add sources if present
      if (leadsData) {
        map.addSource('leads', { type: 'geojson', data: leadsData });
        map.addLayer({
          id: 'leads-circles',
          type: 'circle',
          source: 'leads',
          paint: {
            'circle-color': LEADS_COLOR,
            'circle-radius': sizeByZoom(),
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 1
          }
        });
      }
      if (compsData) {
        map.addSource('comps', { type: 'geojson', data: compsData });
        map.addLayer({
          id: 'comps-circles',
          type: 'circle',
          source: 'comps',
          paint: {
            'circle-color': compsColorExpression(),
            'circle-radius': sizeByZoom(),
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 1
          }
        });
      }

      // Fit to all data if no explicit focus/viewport
      const bboxParam = param('bbox', null);
      const lat = parseFloat(param('lat', ''));
      const lng = parseFloat(param('lng', ''));
      const focus = param('focus', null);
      const focusField = param('focusField', null);
      const focusType = (param('focusType','any') || 'any').toLowerCase();
      const zoom = parseFloat(param('zoom', '16'));
      const openpopup = boolParam('openpopup', false);

      if (bboxParam) {
        const parts = bboxParam.split(',').map(Number);
        if (parts.length === 4 && parts.every(isFinite)) {
          map.fitBounds([[parts[0],parts[1]],[parts[2],parts[3]]], { padding: 40, duration: 800 });
        }
      } else if (isFinite(lat) && isFinite(lng)) {
        map.flyTo({ center: [lng, lat], zoom: isFinite(zoom)?zoom:16, essential:true });
      } else if (focus && (leadsData || compsData)) {
        let f = null, layerId = null;
        if ((focusType === 'leads' || focusType === 'any') && leadsData) {
          f = findFeatureById(leadsData, focusField, focus);
          if (f) layerId = 'leads-circles';
        }
        if (!f && (focusType === 'comps' || focusType === 'any') && compsData) {
          f = findFeatureById(compsData, focusField, focus);
          if (f) layerId = 'comps-circles';
        }
        if (f) {
          const center = featureCenter(f);
          if (center) {
            map.flyTo({ center, zoom: isFinite(zoom)?zoom:16, essential:true });
            if (openpopup) {
              const html = buildPopupHTML(f, layerId?.startsWith('comps') ? 'comps' : 'leads');
              new mapboxgl.Popup({ closeOnClick: true })
                .setLngLat(center)
                .setHTML(html)
                .addTo(map);
            }
          }
        } else {
          // No focus found → fit to all
          const bounds = new mapboxgl.LngLatBounds();
          let added = false;
          for (const data of [leadsData, compsData]) {
            if (!data || !Array.isArray(data.features)) continue;
            for (const feat of data.features) {
              const c = featureCenter(feat);
              if (c) { bounds.extend(c); added = true; }
            }
          }
          if (added) map.fitBounds(bounds, { padding: 40, duration: 800 });
        }
      } else {
        // Default extent
        const bounds = new mapboxgl.LngLatBounds();
        let added = false;
        for (const data of [leadsData, compsData]) {
          if (!data || !Array.isArray(data.features)) continue;
          for (const feat of data.features) {
            const c = featureCenter(feat);
            if (c) { bounds.extend(c); added = true; }
          }
        }
        if (added) map.fitBounds(bounds, { padding: 40, duration: 800 });
      }

      // Interactions
      function attachInteractions(layerId, type) {
        if (!map.getLayer(layerId)) return;
        map.on('mouseenter', layerId, () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', layerId, () => map.getCanvas().style.cursor = '');
        map.on('click', layerId, (e) => {
          const f = e.features[0];
          const html = buildPopupHTML(f, type);
          new mapboxgl.Popup({ closeOnClick: true })
            .setLngLat(e.lngLat)
            .setHTML(html)
            .addTo(map);
        });
      }
      attachInteractions('leads-circles','leads');
      attachInteractions('comps-circles','comps');

      // Layer toggles
      const leadsToggle = document.getElementById('toggle-leads');
      const compsToggle = document.getElementById('toggle-comps');
      function setVis(layerId, visible) {
        if (!map.getLayer(layerId)) return;
        map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
      }
      setVis('leads-circles', showLeadsInitial);
      setVis('comps-circles', showCompsInitial);
      leadsToggle.checked = showLeadsInitial;
      compsToggle.checked = showCompsInitial;

      leadsToggle?.addEventListener('change', () => setVis('leads-circles', leadsToggle.checked));
      compsToggle?.addEventListener('change', () => setVis('comps-circles', compsToggle.checked));

      // Surface any load errors
      if (errors.length) {
        const div = document.createElement('div');
        div.className = 'error';
        div.textContent = 'Some data failed to load: ' + errors.join(' | ');
        document.body.appendChild(div);
      }
    });
  })();
</script>
</body>
</html>
