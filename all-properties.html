<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>All Properties Map – LeadSyfter</title>

<!-- Mapbox Core -->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>

<!-- Mapbox Geocoder Plugin -->
<link
  rel="stylesheet"
  href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.2/mapbox-gl-geocoder.css"
/>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.2/mapbox-gl-geocoder.min.js"></script>

<!-- Turf.js for drawing distance rings -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }

  /* Floating controls */
  .mapboxgl-ctrl-top-right { top: 100px; }

  /* Control panel styling */
  .panel {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 2;
    background: rgba(255,255,255,0.92);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    max-width: 320px;
  }
  .panel h2 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
  .panel label { font-size: 13px; display: block; margin: 6px 0; cursor: pointer; }
  select, input[type="checkbox"] { cursor: pointer; }
  .legend { margin-top: 10px; font-size: 13px; }
  .legend div { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; }

  /* Popup */
  .popup { font-family: "Segoe UI", Roboto, Arial; font-size: 13px; }
  .popup .title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .popup .meta { color: #555; margin-bottom: 6px; }
  .popup .btns a {
    display: inline-block;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 4px 8px;
    margin-right: 5px;
    text-decoration: none;
    color: #003d60;
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="map"></div>

<!-- Panel -->
<div class="panel">
  <h2>All Properties Map</h2>
  <label>Map Style:
    <select id="styleSelect">
      <option value="mapbox://styles/mapbox/streets-v12">Streets</option>
      <option value="mapbox://styles/mapbox/outdoors-v12">Outdoors</option>
      <option value="mapbox://styles/mapbox/light-v11">Light</option>
      <option value="mapbox://styles/mapbox/dark-v11">Dark</option>
      <option value="mapbox://styles/mapbox/satellite-streets-v12">Satellite</option>
    </select>
  </label>

  <label><input type="checkbox" id="terrainToggle" /> Show Terrain</label>
  <label><input type="checkbox" id="buildingsToggle" /> Show 3D Buildings</label>

  <div class="legend">
    <strong>Legend</strong>
    <div><span class="swatch" style="background:#1E90FF"></span> Project – Leads</div>
    <div><span class="swatch" style="background:#FFA500"></span> Project – Deals</div>
    <div><span class="swatch" style="background:#2ECC71"></span> Project – Closed</div>
    <div><span class="swatch" style="background:#95A5A6"></span> Project – Archive</div>
    <div><span class="swatch" style="background:#16A085"></span> Comp – Active</div>
    <div><span class="swatch" style="background:#F39C12"></span> Comp – Escrow</div>
    <div><span class="swatch" style="background:#C0392B"></span> Comp – Sold</div>
    <div><span class="swatch" style="background:#7F8C8D"></span> Comp – Withdrawn</div>
  </div>
</div>

<!-- Geocoder search bar -->
<div id="geocoder" class="mapboxgl-ctrl-top-left"></div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoibGVhZHN5ZnRlciIsImEiOiJjbWdsbDFzMTAxNzM2MnJuMnBhaG4zdjIzIn0.DoK-vOBajHoFXDIKK9HyGg';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  center: [-117.15, 32.78],
  zoom: 10
});

// Controls
map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');
map.addControl(new mapboxgl.FullscreenControl(), 'bottom-right');
map.addControl(new mapboxgl.ScaleControl({maxWidth: 120, unit: 'imperial'}));

const geocoder = new MapboxGeocoder({
  accessToken: mapboxgl.accessToken,
  mapboxgl: mapboxgl,
  marker: false,
  placeholder: 'Search address or place...'
});
document.getElementById('geocoder').appendChild(geocoder.onAdd(map));

// Style & toggles
document.getElementById('styleSelect').addEventListener('change', e => map.setStyle(e.target.value));
document.getElementById('terrainToggle').addEventListener('change', e => toggleTerrain(e.target.checked));
document.getElementById('buildingsToggle').addEventListener('change', e => toggleBuildings(e.target.checked));

function toggleTerrain(enabled) {
  if (enabled) {
    if (!map.getSource('mapbox-dem')) {
      map.addSource('mapbox-dem', { type: 'raster-dem', url: 'mapbox://mapbox.mapbox-terrain-dem-v1', tileSize: 512, maxzoom: 14 });
      map.setTerrain({ source: 'mapbox-dem', exaggeration: 1.2 });
    }
  } else map.setTerrain(null);
}

function toggleBuildings(enabled) {
  if (enabled && map.getLayer('3d-buildings')) return;
  if (enabled) {
    const layers = map.getStyle().layers;
    const labelLayerId = layers.find(l => l.type === 'symbol' && l.layout['text-field']).id;
    map.addLayer({
      id: '3d-buildings',
      source: 'composite',
      'source-layer': 'building',
      filter: ['==', 'extrude', 'true'],
      type: 'fill-extrusion',
      minzoom: 14,
      paint: {
        'fill-extrusion-color': '#aaa',
        'fill-extrusion-height': ['get', 'height'],
        'fill-extrusion-base': ['get', 'min_height'],
        'fill-extrusion-opacity': 0.6
      }
    }, labelLayerId);
  } else if (map.getLayer('3d-buildings')) {
    map.removeLayer('3d-buildings');
  }
}

// Fetch data
async function fetchJSON(path) {
  const r = await fetch(path, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`Fetch failed: ${path}`);
  return r.json();
}

Promise.all([
  fetchJSON('projects.json'),
  fetchJSON('comps.json')
]).then(([projects, comps]) => {
  addFeatures('projects', projects, {
    Leads: '#1E90FF',
    Deals: '#FFA500',
    Closed: '#2ECC71',
    Archive: '#95A5A6'
  });
  addFeatures('comps', comps, {
    Active: '#16A085',
    Escrow: '#F39C12',
    Sold: '#C0392B',
    Withdrawn: '#7F8C8D'
  });
}).catch(console.error);

function addFeatures(prefix, geojson, colors) {
  if (!geojson || !geojson.features) return;
  map.addSource(prefix, { type: 'geojson', data: geojson });
  for (const [status, color] of Object.entries(colors)) {
    const id = `${prefix}-${status}`;
    map.addLayer({
      id,
      type: 'circle',
      source: prefix,
      filter: ['==', ['get', 'status'], status],
      paint: {
        'circle-radius': 7,
        'circle-color': color,
        'circle-stroke-color': '#00000050',
        'circle-stroke-width': 1
      }
    });
    map.on('click', id, e => showPopup(e.features[0]));
    map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', id, () => map.getCanvas().style.cursor = '');
  }
}

let popup;
function showPopup(f) {
  const p = f.properties;
  const html = `
    <div class="popup">
      <div class="title">${p.name || '(Unnamed Property)'}</div>
      <div class="meta">${p.address || ''} • ${p.status || ''}</div>
      <div class="meta">
        ${p.sqft ? Number(p.sqft).toLocaleString() + ' sf' : ''}
        ${p.price ? ' • $' + Number(p.price).toLocaleString() : ''}
      </div>
      <div class="btns">
        ${p.navLat && p.navLon ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${p.navLat},${p.navLon}" target="_blank">Navigate</a>` : ''}
        ${p.recordUrl ? `<a href="${p.recordUrl}" target="_blank">View Info</a>` : ''}
      </div>
    </div>`;
  if (popup) popup.remove();
  popup = new mapboxgl.Popup({ offset: 15, maxWidth: '360px' })
    .setLngLat(f.geometry.coordinates)
    .setHTML(html)
    .addTo(map);
}
</script>
</body>
</html>
