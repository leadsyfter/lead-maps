<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>All Properties Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
  <style>
    :root{
      --panel-bg:#fff; --panel-shadow:0 2px 10px rgba(0,0,0,.08);
      --line:#e6e6e6; --pad:12px;
    }
    html, body { height:100%; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:#1a1a1a;}
    #map { position:absolute; top:0; bottom:360px; width:100%; }
    #controls { position:absolute; top:10px; left:10px; background:var(--panel-bg); padding:10px; border-radius:8px; box-shadow:var(--panel-shadow); font-size:14px; max-width:320px; z-index:5; }
    #controls h3{margin:0 0 6px 0; font-size:14px; color:#333;}
    #controls .group{margin-bottom:8px; border-top:1px solid var(--line); padding-top:6px;}
    .legend-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle;}
    .muted { color:#777; font-size:12px; }
    #table-container { position:absolute; bottom:0; width:100%; max-height:360px; overflow:auto; background:#fff; border-top:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; font-size:13px;}
    th, td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
    th { background:#f7f7f7; position:sticky; top:0; z-index:2;}
    .btn-ring { cursor:pointer; padding:4px 8px; border:1px solid #bbb; border-radius:6px; background:#fafafa; font-size:12px; }
    .btn-ring.active { background:#e6f2ff; border-color:#7fb3ff; }
    .nowrap { white-space:nowrap; }
    .searchbar { position:absolute; top:10px; right:10px; background:#fff; padding:8px; border-radius:8px; box-shadow:var(--panel-shadow); z-index:5; width:280px; }
    .searchbar input { width:100%; padding:6px 8px; border:1px solid #ddd; border-radius:6px; font-size:13px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="controls">
    <h3>Layers</h3>
    <div class="group">
      <label><input type="checkbox" data-category="Current Lead" checked> <span class="legend-dot" style="background:#0000FF"></span>Current Lead</label><br>
      <label><input type="checkbox" data-category="Active Pursuit" checked> <span class="legend-dot" style="background:#FFD700"></span>Active Pursuit</label><br>
      <label><input type="checkbox" data-category="Owned Property" checked> <span class="legend-dot" style="background:#800080"></span>Owned Property</label><br>
      <label><input type="checkbox" data-category="Completed Project" checked> <span class="legend-dot" style="background:#000000"></span>Completed Project</label>
    </div>
    <div class="group">
      <label><input type="checkbox" data-category="Sale Comp - Active" checked> <span class="legend-dot" style="background:#008000"></span>Comp – Active</label><br>
      <label><input type="checkbox" data-category="Sale Comp - Escrow" checked> <span class="legend-dot" style="background:#FFA500"></span>Comp – Escrow</label><br>
      <label><input type="checkbox" data-category="Sale Comp - Sold" checked> <span class="legend-dot" style="background:#FF0000"></span>Comp – Sold</label>
    </div>
    <div class="group">
      <div class="muted">Deep-link params: <code>leadId</code>, <code>compId</code>, <code>address</code>, <code>cat</code>, <code>show</code>, <code>zoom</code>, <code>buffer</code>, <code>rings</code>, <code>ringDistances</code>, <code>t</code></div>
    </div>
  </div>

  <div class="searchbar">
    <input id="search-input" type="text" placeholder="Filter table by address, category, notes…" />
  </div>

  <div id="table-container">
    <table id="property-table">
      <thead>
        <tr id="thead-row">
          <th>Category</th>
          <th>Address</th>
          <th class="nowrap">SqFt</th>
          <th>Year</th>
          <th>Price</th>
          <th>Sale Date</th>
          <th># Units</th>
          <th>Link</th>
          <th>Rings</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    // ===== CONFIG =====
    mapboxgl.accessToken = 'YOUR_MAPBOX_TOKEN';
    const GEOJSON_URL = 'all-properties.geojson'; // same repo as this HTML

    // ===== UTILITIES =====
    function bust(url) { return url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(); }

    const params = new URLSearchParams(location.search);
    const targetLeadId = params.get('leadId');
    const targetCompId = params.get('compId');
    const targetAddress = params.get('address');
    const forcedCat = params.get('cat');
    const showParam = params.get('show'); // comma list
    const zoomParam = Number(params.get('zoom'));
    const bufferMeters = Number(params.get('buffer')) || 0;
    const ringsParam = (params.get('rings') || '').toLowerCase(); // 'on' to auto-show
    const ringDistancesParam = params.get('ringDistances'); // "0.25,0.5,1,2"
    const defaultRingMiles = ringDistancesParam ? ringDistancesParam.split(',').map(Number) : [0.25, 0.5, 1, 2];

    // ===== MAP =====
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v11',
      center: [-118.2437, 34.0522],
      zoom: 8
    });

    // Category colors
    const categoryColors = {
      "Current Lead": "#0000FF",
      "Active Pursuit": "#FFD700",
      "Owned Property": "#800080",
      "Completed Project": "#000000",
      "Sale Comp - Active": "#008000",
      "Sale Comp - Escrow": "#FFA500",
      "Sale Comp - Sold": "#FF0000"
    };

    // Optional: per-category column config (union used for table)
    const CATEGORY_CONFIG = {
      "Current Lead": {
        columns: [["address","Address"],["sqft","SqFt"],["units","# Units"],["year","Year"],["price","Price"],["saleDate","Sale Date"],["link","Link"]]
      },
      "Active Pursuit": {
        columns: [["address","Address"],["sqft","SqFt"],["units","# Units"],["year","Year"],["link","Link"]]
      },
      "Owned Property": {
        columns: [["address","Address"],["sqft","SqFt"],["year","Year"],["link","Link"]]
      },
      "Completed Project": {
        columns: [["address","Address"],["sqft","SqFt"],["year","Year"],["link","Link"]]
      },
      "Sale Comp - Active": {
        columns: [["address","Address"],["sqft","SqFt"],["status","Status"],["price","Price"],["pricePerSqft","$/SF"],["dom","DOM"],["link","Link"]]
      },
      "Sale Comp - Escrow": {
        columns: [["address","Address"],["sqft","SqFt"],["status","Status"],["price","Price"],["pricePerSqft","$/SF"],["dom","DOM"],["link","Link"]]
      },
      "Sale Comp - Sold": {
        columns: [["address","Address"],["sqft","SqFt"],["status","Status"],["saleDate","Sale Date"],["price","Price"],["pricePerSqft","$/SF"],["capRate","Cap %"],["dom","DOM"],["link","Link"]]
      }
    };

    // ===== DATA =====
    let allFeatures = [];
    const activeRingIds = new Set();
    let textFilter = '';

    function ensureFeatureCollection(obj){
      if (obj?.type === 'FeatureCollection' && Array.isArray(obj.features)) return obj;
      throw new Error('Invalid GeoJSON FeatureCollection');
    }

    // ===== LOAD DATA WITH CACHE-BUST =====
    fetch(bust(GEOJSON_URL))
      .then(r => {
        if (!r.ok) throw new Error('Failed to fetch GeoJSON: ' + r.status);
        return r.json();
      })
      .then(fc => {
        fc = ensureFeatureCollection(fc);
        allFeatures = fc.features.filter(f => f?.geometry?.type === 'Point' && Array.isArray(f.geometry.coordinates));
        map.on('load', () => {
          addCategoryLayers(allFeatures);
          addRingLayers();
          wirePopups();

          if (forcedCat) {
            const targets = findTargetFeatures(allFeatures);
            if (targets.length) {
              targets.forEach(ft => ft.properties.category = forcedCat);
              refreshCategorySources();
            }
          }

          initialVisibilityFromShowParam();
          const target = findTargetFeatures(allFeatures);
          if (target.length) zoomToFeatures(target);

          renderTable(filteredForTable(allFeatures));
          if (ringsParam === 'on' && target.length === 1) {
            const ft = target[0];
            toggleRingsForFeature(ft, defaultRingMiles, true);
            markRowRingActive(getFeatureKey(ft), true);
          }
          console.log('Loaded features:', allFeatures.length);
        });
      })
      .catch(err => {
        console.error(err);
        alert('Could not load data. See console for details.');
      });

    // ===== LAYERS & SOURCES =====
    function srcForCategory(cat){ return `src:${cat}`; }
    function layerForCategory(cat){ return `layer:${cat}`; }

    function addCategoryLayers(features){
      Object.keys(categoryColors).forEach(cat => {
        const srcId = srcForCategory(cat);
        const layerId = layerForCategory(cat);
        map.addSource(srcId, {
          type: 'geojson',
          data: {
            type: 'FeatureCollection',
            features: features.filter(f => (f.properties||{}).category === cat)
          }
        });
        map.addLayer({
          id: layerId,
          type: 'circle',
          source: srcId,
          paint: {
            'circle-radius': 6,
            'circle-color': categoryColors[cat],
            'circle-stroke-width': 1,
            'circle-stroke-color': '#ffffff'
          }
        });
      });
    }
    function refreshCategorySources(){
      Object.keys(categoryColors).forEach(cat => {
        const src = map.getSource(srcForCategory(cat));
        if (src){
          const subset = allFeatures.filter(f => (f.properties||{}).category === cat);
          src.setData({ type:'FeatureCollection', features: subset });
        }
      });
    }

    // ===== POPUPS =====
    function popupHtml(p){
      const photo = p.photoUrl ? `<div style="margin-top:6px;"><img src="${p.photoUrl}" width="220" loading="lazy"></div>` : '';
      const addr = p.propertyAddress || p.address || '';
      const priceFmt = v => (v||v===0) ? Number(v).toLocaleString() : '';
      const rows = [
        ['Category', p.category || ''],
        ['SqFt', p.sqft ? Number(p.sqft).toLocaleString() : (p.buildingSqft ? Number(p.buildingSqft).toLocaleString(): '')],
        ['Year', p.year || ''],
        ['# Units', p.units ?? ''],
        ['Price', priceFmt(p.price || p.salePrice)],
        ['Sale Date', p.saleDate || ''],
        ['DOM', p.dom ?? ''],
        ['Zoning', p.zoning || '']
      ].map(([k,v]) => v ? `<div><strong>${k}:</strong> ${v}</div>` : '').join('');
      const link = p.link ? `<div style="margin-top:6px;"><a href="${p.link}" target="_blank">Open record</a></div>` : '';
      return `<div style="min-width:240px;"><strong>${addr}</strong>${rows}${link}${photo}</div>`;
    }
    function wirePopups(){
      const layerIds = Object.keys(categoryColors).map(layerForCategory);
      map.on('click', (e) => {
        const feats = map.queryRenderedFeatures(e.point, { layers: layerIds });
        if (!feats.length) return;
        const p = feats[0].properties || {};
        new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(popupHtml(p)).addTo(map);
      });
    }

    // ===== DEEP LINK / VISIBILITY =====
    function initialVisibilityFromShowParam(){
      if (!showParam) return;
      const showList = showParam.split(',').map(s => s.trim());
      document.querySelectorAll('#controls input[type="checkbox"]').forEach(cb => {
        const cat = cb.dataset.category;
        const visible = showList.includes(cat);
        cb.checked = visible;
        const layerId = layerForCategory(cat);
        if (map.getLayer(layerId)){
          map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
        }
      });
    }
    function getVisibleCategories(){
      return Array.from(document.querySelectorAll('#controls input:checked')).map(cb => cb.dataset.category);
    }
    document.addEventListener('change', (e) => {
      if (e.target.matches('#controls input[type="checkbox"]')){
        const cat = e.target.dataset.category;
        const layerId = layerForCategory(cat);
        if (map.getLayer(layerId)){
          map.setLayoutProperty(layerId, 'visibility', e.target.checked ? 'visible' : 'none');
        }
        renderTable(filteredForTable(allFeatures));
      }
    });

    // ===== TARGETING & ZOOM =====
    function getFeatureKey(f){ const p = f.properties || {}; return p.id || p.leadId || p.compId || p._sid; }
    function getFeatureCoord(f){ return (f.geometry && f.geometry.coordinates) ? f.geometry.coordinates : null; }
    function findTargetFeatures(features){
      const res = [];
      if (targetLeadId || targetCompId){
        features.forEach(f => {
          const p = f.properties || {};
          if ((targetLeadId && p.leadId === targetLeadId) || (targetCompId && p.compId === targetCompId)) res.push(f);
        });
        if (res.length) return res;
      }
      if (targetAddress){
        const needle = targetAddress.toLowerCase();
        features.forEach(f => {
          const addr = ((f.properties||{}).propertyAddress || (f.properties||{}).address || '').toLowerCase();
          if (addr && addr.includes(needle)) res.push(f);
        });
      }
      return res;
    }
    function zoomToFeatures(features){
      if (!features.length) return;
      const pts = features.filter(f => getFeatureCoord(f));
      if (!pts.length) return;
      const fc = {type:'FeatureCollection', features: pts};
      let bbox;
      if (bufferMeters > 0){
        const buffered = turf.buffer(fc, bufferMeters, {units:'meters'});
        bbox = turf.bbox(buffered);
      } else {
        bbox = turf.bbox(fc);
      }
      if (zoomParam && features.length === 1){
        map.flyTo({ center: getFeatureCoord(features[0]), zoom: zoomParam });
      } else {
        map.fitBounds([[bbox[0], bbox[1]], [bbox[2], bbox[3]]], { padding: 60, maxZoom: 16 });
      }
    }

    // ===== RINGS =====
    function addRingLayers(){
      if (!map.getSource('rings')) {
        map.addSource('rings', { type:'geojson', data: emptyFC() });
        map.addLayer({ id:'rings-fill', type:'fill', source:'rings', paint:{ 'fill-color':'#1E90FF', 'fill-opacity':0.08 }});
        map.addLayer({ id:'rings-line', type:'line', source:'rings', paint:{ 'line-color':'#1E90FF', 'line-width':1.2, 'line-dasharray':[2,2] }});
      }
    }
    function emptyFC(){ return {type:'FeatureCollection', features:[]}; }
    function toggleRingsForFeature(feature, milesArray, turnOn){
      const id = getFeatureKey(feature);
      const coord = getFeatureCoord(feature);
      if (!coord) return;
      const ringsSrc = map.getSource('rings');
      const existing = ringsSrc._data || emptyFC();
      const others = existing.features.filter(ft => (ft.properties||{})._ringOf !== id);

      if (turnOn){
        const newRings = [];
        milesArray.forEach(mi => {
          const km = mi * 1.60934;
          const circle = turf.circle(coord, km, {steps: 128, units:'kilometers'});
          circle.properties = circle.properties || {};
          circle.properties._ringOf = id;
          circle.properties._miles = mi;
          newRings.push(circle);
        });
        ringsSrc.setData({ type:'FeatureCollection', features: others.concat(newRings) });
        activeRingIds.add(id);
      } else {
        ringsSrc.setData({ type:'FeatureCollection', features: others });
        activeRingIds.delete(id);
      }
    }

    // ===== TABLE =====
    const theadRow = document.getElementById('thead-row');
    const tbody = document.querySelector('#property-table tbody');
    const searchInput = document.getElementById('search-input');

    function visibleColumns(){
      // union of columns across visible categories, preserving order
      const mapCols = new Map();
      getVisibleCategories().forEach(cat => {
        (CATEGORY_CONFIG[cat]?.columns || []).forEach(([key,label]) => {
          if (!mapCols.has(key)) mapCols.set(key,label);
        });
      });
      // enforce a baseline order similar to header scaffold
      const preferred = [['address','Address'],['sqft','SqFt'],['year','Year'],['price','Price'],['saleDate','Sale Date'],['units','# Units'],['link','Link']];
      preferred.forEach(([k,l])=>{ if (!mapCols.has(k)) mapCols.set(k,l); });
      return Array.from(mapCols.entries());
    }
    function renderTable(features){
      // (Optional) rebuild header dynamically if you want exact union; current header is fine.

      // body
      tbody.innerHTML = '';
      features.forEach(f => {
        const p = f.properties || {};
        const id = getFeatureKey(f);
        const ringActive = activeRingIds.has(id);
        const addr = p.propertyAddress || p.address || '';
        const sqft = p.sqft || p.buildingSqft;
        const price = p.price ?? p.salePrice;
        const row = `
          <tr data-id="${id}">
            <td>${p.category || ''}</td>
            <td>${addr}</td>
            <td>${sqft ? Number(sqft).toLocaleString() : ''}</td>
            <td>${p.year || ''}</td>
            <td>${(price||price===0) ? Number(price).toLocaleString() : ''}</td>
            <td>${p.saleDate || ''}</td>
            <td>${p.units ?? ''}</td>
            <td>${p.link ? `<a href="${p.link}" target="_blank">Link</a>` : ''}</td>
            <td><button class="btn-ring ${ringActive ? 'active' : ''}" data-id="${id}">${ringActive ? 'Rings On' : 'Rings Off'}</button></td>
          </tr>`;
        tbody.insertAdjacentHTML('beforeend', row);
      });
      // bind ring buttons
      tbody.querySelectorAll('.btn-ring').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const ft = allFeatures.find(x => getFeatureKey(x) === id);
          if (!ft || !getFeatureCoord(ft)) return;
          const turningOn = !activeRingIds.has(id);
          toggleRingsForFeature(ft, defaultRingMiles, turningOn);
          markRowRingActive(id, turningOn);
        });
      });
    }
    function markRowRingActive(id, active){
      const btn = document.querySelector(`.btn-ring[data-id="${id}"]`);
      if (!btn) return;
      if (active){ btn.classList.add('active'); btn.textContent = 'Rings On'; }
      else { btn.classList.remove('active'); btn.textContent = 'Rings Off'; }
    }
    function filteredForTable(all){
      const visibleCats = getVisibleCategories();
      let subset = all.filter(f => visibleCats.includes((f.properties||{}).category));

      // text filter
      if (textFilter) {
        const q = textFilter.toLowerCase();
        subset = subset.filter(f => {
          const p = f.properties || {};
          const hay = [
            p.propertyAddress || p.address || '',
            p.category || '',
            p.notes || ''
          ].join(' ').toLowerCase();
          return hay.includes(q);
        });
      }

      // deep-link narrowing
      const target = findTargetFeatures(all);
      if (target.length){
        const ids = new Set(target.map(getFeatureKey));
        subset = subset.filter(f => ids.has(getFeatureKey(f)));
      }
      return subset;
    }
    searchInput.addEventListener('input', e => {
      textFilter = e.target.value || '';
      renderTable(filteredForTable(allFeatures));
    });

  </script>
</body>
</html>
